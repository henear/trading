server.port=8080

# DeepSeek API - set via environment variable DEEPSEEK_API_KEY or replace below
deepseek.api.key=${DEEPSEEK_API_KEY:your-deepseek-api-key-here}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-reasoner

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/tradingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.schema-locations=classpath:database/schema.sql
